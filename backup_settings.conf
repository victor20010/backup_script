#0 Disable volume key selection (if option is not set, force volume key selection)
#1 Enable volume key selection (if option is set, skip the option prompt)
#2 Use keyboard input, applicable to devices without volume keys (if option is not set, force keyboard input)
Lo=0

# Background script execution
0 Cannot close the current terminal, there is compression rate
1 The terminal may not display at all, but the log will continue to refresh, you can directly close the terminal completely
background_execution=0

# Script language setting Leave blank to automatically identify the system language environment and translate
#1 Simplified Chinese 0Traditional Chinese
Shell_LANG=

#Customize the backup file output location. Support relative path (leave blank to default to current path)
Output_path=""

#Customize the applist.txt location. Support relative path (leave blank to default to current path)
list_location=""

#Automatically update script (leave blank to force selection)
#1Open 0Close
update=1

#Customize external mount point shielding. For example: OTG virtual SD, etc. For multiple mount points, please use | to separate
#After shielding, the volume key selection will not be prompted, and the external storage location specified by Output_path will not be affected
mount_point="rannki|0000-1"

#User (such as 0 999 and other users. If there are multiple users, leave it blank for forced selection. If there are no multiple users, the default user 0 will not be asked)
user=0

#Backup mode
#1 includes data + installation package, 0 only includes installation package
#When this option is set to 1, Backup_obb_data, Backup_user_data, and blacklist_mode will be available. When 0, Backup_user_data, Backup_obb_data, and blacklist_mode options will not take effect
#In addition, when set to 0, appList.txt will be ignored at the same time! and any blacklist settings (including blacklist lists)
Backup_Mode=1

#When executing Generate Application List.sh, output the card flash package for recovery rescue?
#1 output 0 do not output
recovery_flash=0

#Whether to back up user data (1 backup 0 do not backup leave blank for mandatory selection)
Backup_user_data=1

#Whether to back up external data Example: Genshin Impact data package (1 backup 0 do not backup leave blank for mandatory selection)
Backup_obb_data=1

#Whether to back up a custom directory after application data backup is completed
#1 open 0 close
backup_media=1

#Ignore backup of existing processes (1 ignore 0 backup)
Background_apps_ignore=0

#If you encounter abnormal list output, please set this to 1
debug_list=0

#Add a custom backup path Example: Download DCIM and other folders Please use the absolute path, do not delete ""
Custom_path="
/storage/emulated/0/Pictures/
/storage/emulated/0/Download/
/storage/emulated/0/DCIM/
/data/adb
"
#Blacklist mode (1 completely ignore, do not back up 0 only back up the installation package, note! This option Backup_Mode = 1 when the blacklist mode can be used)
blacklist_mode = 0

#Backup blacklist (backup strategy is controlled by the "blacklist mode", here is only used as a blacklist application list)
blacklist="
com.esunbank
com.esunbank.ESUNWALLET
#com.chailease.tw.app.android.ccfappcust"

#Pre-installed application whitelist located in data Example: Album Recorder Weather Calculator, etc. (pre-installed apps are blocked by default. If you need to back up, please add pre-installed apps to the whitelist)
whitelist="
com.xiaomi.xmsf
com.xiaomi.xiaoailite
com.xiaomi.hm.health
com.duokan.phone.remotecontroller
com.miui.weather2
com.milink.service
com.android.soundrecorder
com.miui.virtualsim
com.xiaomi.vipaccount
com.miui.fm
com.xiaomi.shop
com.xiaomi.smarthome
com.miui.notes
com.xiaomi.router
com.xiaomi.mico
dev.miuiicons.pedroz"

#Can be backed up System application whitelist (default block backup system applications, if you need to backup, please add system application whitelist)
system="
com.google.android.calendar
com.google.android.gm
com.google.android.googlequicksearchbox
com.google.android.tts
com.google.android.apps.maps
com.google.android.apps.messaging
com.google.android.inputmethod.latin
com.instagram.android
com.facebook.orca
sh.siava.AOSPMods
com.facebook.katana
com.android.chrome"

#Compression algorithm (zstd can be used tar, tar is only for packaging. If you have any good compression algorithms, please contact me.
#zstd has good compression rate and speed
Compression_method=zstd

#primary color
rgb_a=226
#secondary color
rgb_b=123
rgb_c=177