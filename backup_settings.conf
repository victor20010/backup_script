#0 Turn off volume key selection (if the option is not set, volume key selection is forced)
#1 Turn on volume key selection (if the option is set, skip the option prompt)
#2 Use keyboard input, suitable for devices without volume keys (if the option is not set, keyboard input is forced)
Lo=0

#Run the script in the background
#0 Do not close the current terminal, there is compression rate
#1 The terminal may have no display at all, but the log will continue to refresh, and the terminal can be completely closed directly
background_execution=0

#Script language setting Leave blank to automatically identify the system language environment and translate
#1 Simplified Chinese 0 Traditional Chinese
Shell_LANG=

#Custom backup file output location Supports relative paths (leave blank to default to the current path)
Output_path=""

#Custom applist.txt location Supports relative paths (leave blank to default to the current path)
list_location=""

#Automatic script update (leave blank to force selection)
#1 On 0 Off
update=1

#Custom block external mount points e.g.: OTG virtual SD, etc. Use | to separate multiple mount points
#After blocking, the volume key selection will not be prompted, and the external storage location specified by Output_path will not be affected
mount_point="rannki|0000-1"

#User (e.g. 0 999, etc. users, leave blank to force selection if there are multiple users, default to user 0 if there are no multiple users)
user=0

#Backup mode
#1 Include data + installation package, 0 only package installation package
#When this option is set to 1, Backup_obb_data, Backup_user_data, and blacklist_mode can be set. When set to 0, Backup_user_data, Backup_obb_data, and blacklist_mode options are invalid
#In addition, when set to 0, the ! and any blacklist settings (including the blacklist list) in appList.txt will be ignored
Backup_Mode=1

#Output a recovery flashable zip when running 生成應用列表.sh?
#1 Output 0 Do not output
recovery_flash=0

#Whether to back up user data (1 back up 0 do not back up leave blank to force selection)
Backup_user_data=1

#Whether to back up external data e.g.: Genshin Impact data package (1 back up 0 do not back up leave blank to force selection)
Backup_obb_data=1

#Whether to back up custom directories after application data backup is complete
#1 On 0 Off
backup_media=1

#Ignore backup if there is a process (1 ignore 0 back up)
Background_apps_ignore=0

#If you encounter abnormal list output problems, set this to 1
debug_list=0

#Add custom backup paths e.g.: Download DCIM, etc. folders Please use absolute paths, do not delete ""
Custom_path="
/storage/emulated/0/Pictures/
/storage/emulated/0/Download/
/storage/emulated/0/DCIM/
/data/adb
"

#Blacklist mode (1 completely ignore, do not back up 0 only back up installation package, note! This option can only be used when Backup_Mode=1)
blacklist_mode=0

#Backup blacklist (backup strategy is controlled by "blacklist mode", this is only used as a blacklist application list)
blacklist="
com.esunbank
com.esunbank.ESUNWALLET
#com.chailease.tw.app.android.ccfappcust"

#Pre-installed application whitelist located in data e.g.: Gallery, Recorder, Weather, Calculator, etc. (default is to block backup of pre-installed applications, if you need to back up, please add pre-installed application whitelist)
whitelist="
com.xiaomi.xmsf
com.xiaomi.xiaoailite
com.xiaomi.hm.health
com.duokan.phone.remotecontroller
com.miui.weather2
com.milink.service
com.android.soundrecorder
com.miui.virtualsim
com.xiaomi.vipaccount
com.miui.fm
com.xiaomi.shop
com.xiaomi.smarthome
com.miui.notes
com.xiaomi.router
com.xiaomi.mico
dev.miuiicons.pedroz"

#System application whitelist that can be backed up (default is to block backup of system applications, if you need to back up, please add system application whitelist)
system="
com.google.android.calendar
com.google.android.gm
com.google.android.googlequicksearchbox
com.google.android.tts
com.google.android.apps.maps
com.google.android.apps.messaging
com.google.android.inputmethod.latin
com.instagram.android
com.facebook.orca
sh.siava.AOSPMods
com.facebook.katana
com.android.chrome"

#Compression algorithm (available zstd tar, tar is only for packaging If you have a good compression algorithm, please contact me
#zstd has good compression rate and speed
Compression_method=zstd

#Main color
rgb_a=226
#Secondary color
rgb_b=123
rgb_c=177
